<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Text RETA | Wellness Lab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #eee9e1;
      color: #27372f;
      font-family: Arial, Helvetica, sans-serif;
    }
    .panel {
      width: min(100%, 560px);
      padding: 46px 28px;
      border: 1px solid #b89561;
      background: #f7f1e8;
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 14px;
      color: #8e6f44;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 16px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      font-weight: 400;
      line-height: 1.12;
    }
    p {
      margin: 0 auto 24px;
      max-width: 430px;
      color: #514b42;
      font-size: 16px;
      line-height: 1.65;
    }
    .button {
      display: block;
      width: 100%;
      padding: 17px 24px;
      border-radius: 999px;
      background: #27372f;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      text-decoration: none;
    }
    .fallback {
      margin: 18px auto 0;
      color: #796b5d;
      font-size: 12px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="panel" role="main">
    <div class="eyebrow">Wellness Lab</div>
    <h1>Request your RETA review.</h1>
    <p>Tap below to open Messages to the Wellness Lab care line, then enter <strong>RETA</strong> and send.</p>
    <a class="button" href="sms:+15128569612">Open Messages</a>
    <div class="fallback">You can also text RETA to (512) 856-9612. Requests remain subject to clinical review and availability.</div>
  </div>
</body>
</html>
